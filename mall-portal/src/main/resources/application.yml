server:
  port: 8085
spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    url: jdbc:mysql://http://192.168.153.129:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    druid:
      initial-size: 5 #连接池初始化大小
      min-idle: 10 #最小空闲连接数
      max-active: 20 #最大连接数
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" #不统计这些请求数据
      stat-view-servlet: #访问监控网页的登录用户名和密码
        login-username: druid
        login-password: druid
  data:
    mongodb:
      host: 192.168.153.129
      port: 27017
      database: mall-port
    redis:
      host: http://192.168.153.129 # Redis服务器地址
      database: 0 # Redis数据库索引（默认为0）
      port: 6379 # Redis服务器连接端口
      password:  # Redis服务器连接密码（默认为空）
      timeout: 3000ms # 连接超时时间（毫秒）
  rabbitmq:
    host: http://192.168.153.129
    virtual-host: /mall
    username: mall
    password: mall
  # AI 客服配置（Spring AI）
  ai:
    # 模型提供方选择器：chat 走 openai(=DeepSeek)，embedding 走本地 transformers(ONNX)
    # DeepSeek 没有 embedding 接口，必须把 embedding 指向 transformers，避免 openai embedding 自动配置抢占
    model:
      embedding: transformers
    openai:
      api-key: ${AI_API_KEY:sk-358d61b09b494465b7daec5d99c047c0}
      base-url: https://api.deepseek.com
      # 双保险：显式关闭 openai 的 embedding 自动配置
      embedding:
        enabled: false
      chat:
        options:
          model: deepseek-chat
          max-tokens: 2000
          temperature: 0.7
    # 本地 ONNX embedding（all-MiniLM-L6-v2）模型缓存目录，避免默认临时目录被清理
    embedding:
      transformer:
        onnx:
          # 使用本地模型文件，不从 GitHub 下载（避免 SSL/网络问题）
          model-uri: file:///${user.home}/.mall-ai/onnx-models/all-MiniLM-L6-v2/model.onnx
        tokenizer:
          uri: file:///${user.home}/.mall-ai/onnx-models/all-MiniLM-L6-v2/tokenizer.json
        cache:
          directory: ${user.home}/.mall-ai/onnx-cache
mybatis:
  mapper-locations:
    - classpath:dao/*.xml
    - classpath*:com/**/mapper/*.xml
management:
  endpoints:
    web:
      exposure:
        include: '*' #暴露Actuator的监控端点
  endpoint:
    health:
      show-details: always #显示健康的详细信息
    env:
      show-values: always #默认Actuator的环境变量会以****显示，这里开启显示
    configprops:
      show-values: always #默认Actuator的配置属性会以****显示，这里开启显示
    info:
      enabled: true
redis:
  database: mall-swarm
  key:
    authCode: 'ums:authCode'
    orderId: 'oms:orderId'
    member: 'ums:member'
  expire:
    authCode: 90 # 验证码超期时间
    common: 86400 # 24小时
rabbitmq:
  queue:
    name:
      cancelOrder: cancelOrderQueue
springdoc:
  swagger-ui:
    # 修改Swagger UI路径
    path: /swagger-ui.html
    # 开启Swagger UI界面
    enabled: true
    # 用于配置tag和operation的展开方式，这里配置为都不展开
    doc-expansion: 'none'
  api-docs:
    # 修改api-docs路径
    path: /v3/api-docs
    # 开启api-docs
    enabled: true
  group-configs:
    - group: 'mall-portal'
      packages-to-scan: com.macro.mall.portal.controller
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: Authorization
  # token有效期，单位秒，-1代表永不过期
  timeout: 604800
  # token临时有效期 (指定时间内无操作就视为token过期)，单位秒
  active-timeout: -1
  # 是否允许同一账号并发登录 (为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为false时每次登录新建一个token)
  is-share: false
  # token风格
  token-style: uuid
  # 是否输出操作日志
  is-log: false
  # 是否从cookie中读取token
  is-read-cookie: false
  # 是否从head中读取token
  is-read-header: true
  # token前缀
  token-prefix: Bearer
  # jwt秘钥
  jwt-secret-key: sa-secret-key123
  # 是否打印banner
  is-print: false
# AI Agent 编排配置
agent:
  # Plan-Act-Reflect 最大迭代轮数，防止死循环
  max-iterations: 4
  planner:
    # false 时退化为旧单轮逻辑，便于对照演示
    enabled: true
# RAG 知识库配置
rag:
  enabled: true
  # 知识文档目录
  knowledge-path: classpath:knowledge/
  # SimpleVectorStore 持久化文件，存在则直接 load 不重新 embed
  vector-store-file: ${user.home}/.mall-ai/vector-store.json
  top-k: 4
  similarity-threshold: 0.5
  chunk-token-size: 400


